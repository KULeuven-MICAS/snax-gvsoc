from gvtest.testsuite import *


def check_output(test, output):
    if output.find('TEST PASSED') == -1:
        return (False, "Didn't find TEST PASSED in output\n")
    return (True, None)


def testset_build(testset):

    # Only for targets whose ISS supports the runtime-declared stack checker
    # (targets that provide it set the 'stack_check' capability)
    if testset.get_target().get_property('stack_check'):
        # gvrun-only: relies on the global 'stack-check' build parameter
        # (compile-time instrumentation wired through gvrun's config.py).
        testset.new_gvrun_test('stack_check', checker=check_output)
