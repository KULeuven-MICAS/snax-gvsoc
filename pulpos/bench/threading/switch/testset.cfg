from gvtest.testsuite import *

# Reference values measured on the GVSoC model (2026-07-16, pulpos/core main) — regression
# locks for the calibration report. Targets without an entry report
# measured-only until their references are captured.
# Re-blessed 2026-09-03 with the OS pinned at -O3 (config.py) so the gvrun
# and make flows measure the same kernel (previously the whole build was -Os).
REFS = {
    'gap.gap9.evk': {
        'switch.cycles_per_switch': 116.8,
        'switch.active_cycles_per_switch': 116.0,
        'switch.instructions_per_switch': 93.0,
    },
}

def testset_build(testset):

    tests = testset.new_app_test('switch')
    refs = REFS.get(testset.get_target().get_name(), {})

    def bench(name, extract, desc):
        ref_args = {}
        if name in refs:
            ref_args = dict(ref=refs[name], tol_pct=5, ref_type='measured')
        for test in tests:
            test.add_bench(name, extract, desc, **ref_args)

    for group in ['switch']:
        bench(f'{group}.cycles_per_switch',
            rf'    \[{group}\] Cycles per switch: (\S+)', f'Cycles/switch ({group})')
        bench(f'{group}.active_cycles_per_switch',
            rf'    \[{group}\] Active cycles per switch: (\S+)', f'Active cycles/switch ({group})')
        bench(f'{group}.instructions_per_switch',
            rf'    \[{group}\] Instructions per switch: (\S+)', f'Instructions/switch ({group})')
