from gvtest.testsuite import *

# Reference values measured on the GVSoC model (2026-07-16, pulpos/core main) — regression
# locks for the calibration report. Targets without an entry report
# measured-only until their references are captured.
REFS = {
    'gap.gap9.evk': {
        'active.cycles_per_interrupt': 100.1,
        'active.active_cycles_per_interrupt': 100.1,
        'active.instructions_per_interrupt': 93.0,
        'idle.cycles_per_interrupt': 48.6,
        'idle.active_cycles_per_interrupt': 48.6,
        'idle.instructions_per_interrupt': 40.4,
    },
}

def testset_build(testset):

    tests = testset.new_app_test('callback')
    refs = REFS.get(testset.get_target().get_name(), {})

    def bench(name, extract, desc):
        ref_args = {}
        if name in refs:
            ref_args = dict(ref=refs[name], tol_pct=5, ref_type='measured')
        for test in tests:
            test.add_bench(name, extract, desc, **ref_args)

    # Bench while core is active
    bench('active.cycles_per_interrupt', r'    \[active\] Cycles per interrupt: (\S+)', 'Cycles/interrupt (active)')
    bench('active.active_cycles_per_interrupt', r'    \[active\] Active cycles per interrupt: (\S+)', 'Active cycles/interrupt (active)')
    bench('active.instructions_per_interrupt', r'    \[active\] Instructions per interrupt: (\S+)', 'Instructions/interrupt (active)')

    # Bench while core is idle/sleeping
    bench('idle.cycles_per_interrupt', r'    \[idle\] Cycles per interrupt: (\S+)', 'Cycles/interrupt (idle)')
    bench('idle.active_cycles_per_interrupt', r'    \[idle\] Active cycles per interrupt: (\S+)', 'Active cycles/interrupt (idle)')
    bench('idle.instructions_per_interrupt', r'    \[idle\] Instructions per interrupt: (\S+)', 'Instructions/interrupt (idle)')
