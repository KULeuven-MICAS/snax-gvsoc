from gvtest.testsuite import *


def check_output(test, output):

    if output.find('flash_smoke OK') == -1:
        return (False, "Didn't find success marker\n")

    return (True, None)


# Called by gvtest to declare the tests
def testset_build(testset):

    testset.new_app_test('flash_smoke', checker=check_output)
