[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "config_tree"
version = "0.1.0"
description = "Config system frontend"
requires-python = ">=3.8"
dependencies = [
    "markdown-it-py>=4.0.0",
    "rich>=14.3.3",
]

[tool.hatch.build.targets.wheel]
packages = ["config_tree"]
